name: Publish version branch

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Validate and assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release/}"
          major="${version%%.*}"
          release_dir="releases/${version}"

          test -f "${release_dir}/loris-vpet/pet.json"
          test -f "${release_dir}/loris-vpet/spritesheet.webp"
          test -f "${release_dir}/README_PACKAGE.md"
          test -f "${release_dir}/RELEASE_NOTES.md"
          test -f "qa/${version}/contact-sheet.png"
          test -f "qa/${version}/validation.json"
          jq -e '.ok == true and (.errors | length) == 0 and (.warnings | length) == 0' "qa/${version}/validation.json" >/dev/null

          mkdir -p dist/loris-vpet
          cp "${release_dir}/loris-vpet/pet.json" dist/loris-vpet/
          cp "${release_dir}/loris-vpet/spritesheet.webp" dist/loris-vpet/
          cp "${release_dir}/README_PACKAGE.md" dist/loris-vpet/README.md
          cp THIRD_PARTY_NOTICES.md dist/loris-vpet/NOTICE.md

          (cd dist && zip -9 -r "loris-vpet-${major}.zip" loris-vpet)
          cp "${release_dir}/loris-vpet/spritesheet.webp" "dist/loris-vpet-${major}-spritesheet.webp"
          cp "qa/${version}/contact-sheet.png" "dist/loris-vpet-${major}-contact-sheet.png"
          cp "qa/${version}/validation.json" "dist/loris-vpet-${major}-validation.json"
          (cd dist && sha256sum loris-vpet-${major}* > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release/}"
          major="${version%%.*}"
          if gh release view "${version}" >/dev/null 2>&1; then
            echo "Release ${version} already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "${version}" \
            --target "${GITHUB_SHA}" \
            --title "Loris Codex Pet ${version} / 萝莉斯 Codex 桌宠 ${version}" \
            --notes-file "releases/${version}/RELEASE_NOTES.md" \
            "dist/loris-vpet-${major}.zip" \
            "dist/loris-vpet-${major}-spritesheet.webp" \
            "dist/loris-vpet-${major}-contact-sheet.png" \
            "dist/loris-vpet-${major}-validation.json" \
            "dist/SHA256SUMS.txt"
